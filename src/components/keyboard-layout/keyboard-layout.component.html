@if (keyboard(); as keyboard) {
  <svg
    class="overflow-visible"
    width="100%"
    height="100%"
    preserveAspectRatio="xMidYMid meet"
    [attr.viewBox]="'0 0 ' + keyboard.width + ' ' + keyboard.height"
  >
    @for (key of keyboard.keys; track $index) {
      <rect
        class="fill-none stroke-white stroke-[0.1]"
        [attr.x]="key.x"
        [attr.y]="key.y"
        [attr.width]="key.width"
        [attr.height]="key.height"
        rx="1"
      ></rect>
      @if (key.key; as k) {
        @if (k.unmodified) {
          <text
            [attr.x]="key.x + key.width / 5"
            [attr.y]="key.y + (key.height * 4) / 5"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="3.5px"
            class="fill-gray-100"
          >
            {{ k.unmodified.value }}
          </text>
        }
        @if (k.withShift) {
          <text
            [attr.x]="key.x + key.width / 5"
            [attr.y]="key.y + key.height / 5"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="3.5px"
            class="fill-gray-100"
          >
            {{ k.withShift.value }}
          </text>
        }
        @if (k.withAltGraph) {
          <text
            [attr.x]="key.x + (key.width * 4) / 5"
            [attr.y]="key.y + (key.height * 4) / 5"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="3.5px"
            class="fill-gray-100"
          >
            {{ k.withAltGraph.value }}
          </text>
        }
        @if (k.withShiftAltGraph) {
          <text
            [attr.x]="key.x + (key.width * 4) / 5"
            [attr.y]="key.y + key.height / 5"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="3.5px"
            class="fill-gray-100"
          >
            {{ k.withShiftAltGraph.value }}
          </text>
        }
      }
    }
  </svg>
}
